# ============================================================
# docker-compose.yml — Box CrossFit Platform (Fase 1.4)
#
# ⚠️ AMBIENTES — LEA ESTO ANTES DE LEVANTAR:
#   El archivo BASE usa backend/.env.test → branch TEST de Neon
#   (ep-polished-term...). Es el SAFE DEFAULT a propósito:
#   `docker compose up` NUNCA toca producción por accidente.
#
#   ┌─────────────────────────────────────────────────────────────┐
#   │  TEST (safe default)                                          │
#   │    docker compose up -d                                       │
#   │                                                               │
#   │  PRODUCCIÓN (siempre deliberada)                              │
#   │    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   └─────────────────────────────────────────────────────────────┘
#
# Stack local en contenedores:
#   backend     → FastAPI/uvicorn  (backend/Dockerfile, target prod)
#   maintenance → cron con los scripts de mantenimiento (target maintenance)
#   frontend    → build Vite servido por nginx con proxy /api/ → backend:8000
#   n8n         → automatización visual de flujos (imagen oficial n8nio/n8n)
#
# La BD es EXTERNA (Neon, cloud): este stack NO incluye Postgres.
# El frontend y el backend viven en el MISMO origen (nginx proxea /api/),
# por lo que no hay CORS y VITE_API_URL queda vacío (path relativo).
#
# Volúmenes nombrados (persisten entre recreaciones de contenedores):
#   logs      → /app/logs    COMPARTIDO backend + maintenance.
#               Decisión de Fase 1.4: compartido. cleanup_logs.py (mensual)
#               fue diseñado para limpiar TODOS los *.log de backend
#               (incluido app.log) caminando /app; compartir el volumen
#               conserva esa intención y centraliza la persistencia.
#               Ambos procesos corren como boxapp (UID 1000) → sin
#               conflictos de permisos.
#   backups   → /app/backups  Escribe el contenedor de mantenimiento
#               (pg_dump vía backup_neon.py, retención 30 días).
#               El backend lo monta READ-ONLY (solo inspección).
#   uploads   → /app/app/static/uploads  Vouchers subidos por el API.
# ============================================================
name: box-crossfit

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    env_file:
      # TEST/polished-term (SAFE DEFAULT) — ver cabecera del archivo.
      - ./backend/.env.test
    environment:
      ENVIRONMENT: test
      TZ: America/Santiago
    volumes:
      - logs:/app/logs
      - backups:/app/backups:ro
      - uploads:/app/app/static/uploads
    expose:
      - "8000"
    # Puerto 8001 publicado en el HOST para acceder al API directo (Swagger /docs).
    # El host :8000 está reservado para PRODUCCIÓN (start_server.py). El puerto
    # INTERNO del contenedor sigue siendo 8000 — nginx (frontend) se comunica vía
    # la red docker con backend:8000, sin cambios.
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  maintenance:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: maintenance
    env_file:
      # TEST/polished-term (SAFE DEFAULT) — ver cabecera del archivo.
      - ./backend/.env.test
    environment:
      # health_check.py usa BACKEND_URL para el ping al API.
      # En Docker el backend se llama 'backend' (NO localhost).
      ENVIRONMENT: test
      BACKEND_URL: http://backend:8000
      TZ: America/Santiago
    volumes:
      - logs:/app/logs
      - backups:/app/backups
    # Solo orden de arranque: el contenedor de mantenimiento debe correr
    # aunque el backend esté caído (health_check.py alerta justamente eso).
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # n8n — automatización de flujos (4º servicio).
  #
  # ⚠️ URL DEL BACKEND dentro de los workflows de n8n:
  #    usar  http://host.docker.internal:8000   (¡NO backend:8000!)
  #    Razón: la producción real HOY corre con start_server.py en el HOST
  #    (fuera de Docker); el nombre 'backend:8000' solo resuelve dentro de
  #    esta red de compose. host.docker.internal funciona en AMBOS casos:
  #      · TEST Docker → el puerto 8000 publicado del backend de compose
  #      · PROD real   → el backend del host (start_server.py)
  #    ⚠️ Cuando producción corte a Docker por completo, se PODRÁ cambiar a
  #       http://backend:8000 (o mantener host.docker.internal si el 8000
  #       sigue publicado).
  #
  # Auth básica habilitada desde el inicio: usuario/contraseña se leen de
  # backend/.env.test (N8N_BASIC_AUTH_USER / N8N_BASIC_AUTH_PASSWORD),
  # NUNCA hardcodeados en este archivo.
  # ─────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:2.36.4   # version estable pineada (no latest: reproducible)
    environment:
      # ⚠️ LOGIN (verificado en v2.36.4): n8n v2 ya NO soporta N8N_BASIC_AUTH_*
      #    (feature removida del servidor — esas vars se IGNORAN). El login es
      #    vía USER MANAGEMENT: en el PRIMER acceso a la UI n8n muestra el
      #    formulario para crear el OWNER (email + password, min 8 chars).
      #    /rest/settings → authenticationMethod=email, showSetupOnFirstLoad=true.
      # ── URL/UI en localhost ──
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      # Login por HTTP local: cookie no-secure (si no, no inicia sesión).
      N8N_SECURE_COOKIE: "false"
      # ── Zona horaria Chile (consistente con el resto del stack) ──
      GENERIC_TIMEZONE: America/Santiago
      TZ: America/Santiago
    ports:
      - "5678:5678"                    # UI: http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n       # workflows + credenciales (SQLite por default)
    restart: unless-stopped

volumes:
  logs:
  backups:
  uploads:
  n8n_data:
