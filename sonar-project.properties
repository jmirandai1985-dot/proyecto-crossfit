# SonarQube — configuración del proyecto (SIN token ni credenciales).
# El token y la URL del servidor se pasan al scanner por línea de comandos o
# variables de entorno:
#   sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$env:SONAR_TOKEN
sonar.projectKey=proyecto-crossfit
sonar.projectName=proyecto-crossfit
sonar.projectVersion=1.0

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.sourceEncoding=UTF-8

# Entornos virtuales/herramientas, dependencias y artefactos: fuera del análisis.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/__pycache__/**,**/.venv*/**,**/venv/**,**/.pytest_cache/**,**/test-results/**,**/playwright-report/**,backend/backups/**,backend/data/**,backend/logs/**,backend/uploads/**,frontend/public/**

# Los .env son locales y no versionados; nunca se analizan.
sonar.security.exclusions=**/.env*,**/*.dump,**/*.sqlite,**/*.db

# Reportes de cobertura (si se generan; el scanner tolera que falten).
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
