# ============================================================
# nginx del frontend — Box CrossFit Platform
# - Sirve el build estático de Vite (dist/) en /
# - SPA fallback: cualquier ruta no encontrada → index.html
#   (react-router maneja /tv/ranking/:boxPublicId, /login, /admin/*, etc.)
# - Proxy /api/ → backend:8000 (nombre de servicio del compose, no localhost)
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: ruta no encontrada → index.html (rutas de react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html SIEMPRE revalida con el servidor.
    # Sin esto, el navegador aplica cache heurístico (sin Cache-Control) y puede
    # quedarse con un index viejo que apunta al bundle viejo — que está cacheado
    # como "immutable" 30 días por el bloque /assets/. Resultado: el server ya
    # tiene la versión nueva y el usuario sigue viendo la UI vieja (pasó con el
    # modal de detalle del WOD: el bundle en disco era nuevo y el navegador no).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assets con hash (inmutables, cache largo)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy al backend (mismo origen → sin CORS entre frontend y backend)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy de archivos estáticos subidos (vouchers/imágenes) al backend.
    # Sin este bloque, /static/uploads/... cae en el fallback SPA
    # (try_files ... /index.html) y devuelve index.html en vez del archivo real.
    # Mismo patrón de headers que el bloque /api/ existente.
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
