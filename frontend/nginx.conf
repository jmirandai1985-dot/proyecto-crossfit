# ============================================================
# nginx del frontend — Box CrossFit Platform
# - Sirve el build estático de Vite (dist/) en /
# - SPA fallback: cualquier ruta no encontrada → index.html
#   (react-router maneja /tv/ranking/:boxPublicId, /login, /admin/*, etc.)
# - Proxy /api/ → backend:8000 (nombre de servicio del compose, no localhost)
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: ruta no encontrada → index.html (rutas de react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash (inmutables, cache largo)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy al backend (mismo origen → sin CORS entre frontend y backend)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
