name: Dependency scan

# ─────────────────────────────────────────────────────────────────────────────
# Diagnóstico de dependencias vulnerables (pip-audit + npm audit).
#
# - Se dispara en cada push a `main` y semanalmente (cron).
# - Falla el job si encuentra vulnerabilidades (npm: high/critical; pip-audit:
#   cualquier vuln conocida, porque no tiene umbral de severidad).
# - NO es un gate de merge obligatorio: queda visible en la pestaña Actions.
#   Para que bloquee el merge habría que marcarlo como "required" en las branch
#   protections del repositorio (eso NO se hace acá, por ahora).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  schedule:
    # Semanal: domingo 12:00 UTC.
    - cron: '0 12 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Auditar backend/requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          # pip-audit NO tiene un flag de severidad (--audit-level como npm):
          # falla ante CUALQUIER vulnerabilidad conocida, lo que es más estricto
          # que "sólo alta/crítica". Para un diagnóstico está bien: no deja pasar
          # ni las low/moderate.
          pip-audit -r backend/requirements.txt

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auditar frontend (alta/crítica)
        run: |
          # --audit-level=high: falla sólo con vulnerabilidades high o critical.
          # npm audit lee package-lock.json (no necesita node_modules instalado).
          npm audit --audit-level=high
