# ============================================================
# docker-compose.prod.yml — OVERRIDE PARA PRODUCCIÓN (deliberada)
#
# ⚠️ Este archivo NO se carga automáticamente. Solo se usa cuando se
#    decide apuntar a la BD de PRODUCCIÓN (backend/.env), de forma
#    explícita y conciente:
#
#        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#    Reglas de oro:
#    1. Siempre `docker compose down` antes de cambiar de ambiente
#       (los contenedores se crean con las variables del .env activo).
#    2. El BASE usa backend/.env.test (TEST/polished-term). Para
#       PRODUCCIÓN se agrega ESTE archivo; nunca editar el base.
#    3. `env_file` se concatena en orden (base, luego este archivo) y
#       las variables duplicadas las gana la ÚLTIMA → backend/.env.
#
# Verificación rápida de a qué BD apunta el stack levantado:
#   GET http://localhost:8000/debug/db-url
#     → {"is_safe": true}               = TEST (polished-term)
#     → 404                             = PRODUCCIÓN (no expone nada)
# ============================================================
services:
  backend:
    env_file:
      - ./backend/.env          # PRODUCCIÓN (ep-withered-silence)
    environment:
      ENVIRONMENT: production

  maintenance:
    env_file:
      - ./backend/.env          # PRODUCCIÓN (ep-withered-silence)
    environment:
      ENVIRONMENT: production

  n8n:
    # Misma imagen/config/volumen que el base. El login es vía USER MANAGEMENT
    # (owner email+password) — n8n v2 no soporta N8N_BASIC_AUTH_* (ver comentario
    # del servicio n8n en docker-compose.yml). No necesita env_file de backend.
    # ⚠️ Los webhooks/HTTP-Request de los workflows de n8n siguen apuntando a
    #    http://host.docker.internal:8000 (ver comentario del servicio n8n en
    #    docker-compose.yml): la producción real hoy corre con start_server.py
    #    en el HOST. Solo al cortar producción a Docker se evaluará cambiarlo
    #    a http://backend:8000.
