# ============================================================
# nginx.render.conf — TEMPLATE de nginx para la imagen COMBINADA (Dockerfile.render)
# - Sirve el build estático de Vite (dist/) en /
# - SPA fallback: cualquier ruta no encontrada → index.html
# - Proxy /api/, /static/ y /health → http://127.0.0.1:8000  (uvicorn en el MISMO
#   contenedor; NO hay servicio "backend" separado como en docker-compose).
# - ⚠️ El puerto de escucha es DINÁMICO: se usa el placeholder __PORT__ que el
#   entrypoint reemplaza por el valor de $PORT (Render lo inyecta, default 10000;
#   en pruebas locales sin la variable, cae a 80). nginx no lee env vars nativas,
#   por eso la config se genera con sed en el entrypoint.
# ============================================================
server {
    listen __PORT__;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: ruta no encontrada → index.html (rutas de react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash (inmutables, cache largo)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy al backend (uvicorn en este contenedor → 127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # El público es SIEMPRE https (Render termina el TLS y reenvía HTTP interno).
        # Fijar https evita que los redirects del backend (redirect_slashes de
        # FastAPI) salgan con http:// y sean bloqueados como contenido mixto.
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy de archivos estáticos subidos (vouchers/imágenes) → uvicorn local.
    # Sin este bloque, /static/uploads/... cae en el fallback SPA (index.html).
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Siempre https por el mismo motivo del bloque /api/ (evita redirects http).
        proxy_set_header X-Forwarded-Proto https;
    }

    # Healthcheck: Render (healthCheckPath) y el HEALTHCHECK del Dockerfile
    # apuntan a /health; se proxya a uvicorn para que devuelva el estado real.
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
