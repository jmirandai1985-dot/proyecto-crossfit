# ============================================================
# nginx.render.conf — nginx para la imagen COMBINADA (Dockerfile.render)
# - Sirve el build estático de Vite (dist/) en /
# - SPA fallback: cualquier ruta no encontrada → index.html
# - Proxy /api/ y /static/ → http://127.0.0.1:8000  (uvicorn en el MISMO
#   contenedor; NO hay servicio "backend" separado como en docker-compose).
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: ruta no encontrada → index.html (rutas de react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash (inmutables, cache largo)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy al backend (uvicorn en este contenedor → 127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy de archivos estáticos subidos (vouchers/imágenes) → uvicorn local.
    # Sin este bloque, /static/uploads/... cae en el fallback SPA (index.html).
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck: Render (healthCheckPath) y el HEALTHCHECK del Dockerfile
    # apuntan a /health; se proxya a uvicorn para que devuelva el estado real.
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
