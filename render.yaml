# ============================================================
# render.yaml — Blueprint para desplegar en Render.
#   1) Web Service Docker (imagen combinada: nginx + uvicorn).
#   2) Los 5 Cron Jobs de automatización de PROD (auditoría B4, 2026-10-28)
#      + los 3 de RETENCIÓN de TEST (B8) en modo ENSAYO (`DRY_RUN=1`)
#      + los 3 de RETENCIÓN de PROD (B8) en modo ENSAYO (`DRY_RUN=1`) = 11 `type: cron`.
# La BD es externa (Neon) → NO se declara database en este archivo.
# n8n queda FUERA de este blueprint (corre fuera de Render).
# Los pasos manuales, los env groups y la verificación de los Cron Jobs están en
# docs/CRON_JOBS_RENDER.md; el detalle de cada script, en backend/maintenance/README.md.
# ============================================================
services:
  - type: web
    name: box-crossfit
    runtime: docker
    plan: starter
    dockerfilePath: Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    # ── Migraciones ANTES de activar el código nuevo ──
    # ⚠️ El comando NO puede ser "cd backend && alembic upgrade head": la imagen
    #    (Dockerfile.render) copia backend/alembic/ → /app/alembic/ y
    #    backend/alembic.ini → /app/alembic.ini (WORKDIR /app). Dentro del
    #    contenedor NO existe una carpeta backend/.
    # ⚠️ Si el preDeploy falla, Render ABORTA el deploy y deja la versión
    #    anterior corriendo (no hay outage).
    preDeployCommand: "alembic upgrade head"
    envVars:
      # ── Valores fijos (NO secretos) ──
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # ── Secretos / config por entorno: Render los pide manualmente en el
      #    dashboard (sync: false) para no exponerlos en el archivo de git ──
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: REACTIVACION_OPT_OUT_SECRET
        sync: false
      # ── Archivos subidos por la app (app/services/storage.py) ──
      # PROD guarda en Cloudflare R2 (disco efímero: sin esto, cada deploy borra
      # los comprobantes, certificados e imágenes del Bazar).
      - key: STORAGE_BACKEND
        value: r2
      - key: STORAGE_R2_BUCKET
        value: box-crossfit-uploads
      - key: STORAGE_R2_PUBLIC_BUCKET
        value: box-crossfit-public
      # Secretos/config del bucket: se pegan en el dashboard (sync: false).
      - key: STORAGE_R2_ENDPOINT
        sync: false
      - key: STORAGE_R2_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_R2_PUBLIC_BASE_URL
        sync: false

  # ─────────────────────────────────────────────────────────────
  # CRON JOBS (auditoría B4 — 2026-10-28)
  #
  # Hasta hoy los 5 vivían SÓLO en el dashboard de Render: no se podían auditar ni
  # recrear, y el `DRY_RUN=1` venía en la imagen (fail-open). Ahora están versionados
  # acá y el modo de ejecución es explícito. Guía operativa: docs/CRON_JOBS_RENDER.md
  #
  # Reglas que NO se pueden romper en este bloque:
  #   * `dockerfilePath`/`dockerContext` apuntan a `backend/`: la imagen de cron NO es
  #     la del web service (`Dockerfile.render`); `backend/Dockerfile.cron` sólo copia
  #     los módulos de `maintenance/` (sin FastAPI/SQLAlchemy).
  #   * `dockerCommand` es OBLIGATORIO en cada job: si falta, Render usa el CMD de la
  #     imagen (`maintenance.backup_cloud`) y un job de mantenimiento haría un backup.
  #   * Los env groups (`backups-prod`, `r2-lectura`, `alertas`, `neon-api`,
  #     `mantenimiento-prod`, `kpis-prod`) YA existen en el dashboard con sus secretos:
  #     se referencian con `fromGroup` y NO se declaran acá (el repo no lleva valores).
  #   * `DRY_RUN`: la imagen ya NO lo trae (se quitó de `backend/Dockerfile.cron`).
  #     `mantenimiento_cloud` es fail-closed (sin la variable ⇒ exit 2 + correo), pero
  #     `kpis_cloud` cae a `1` si falta ⇒ los dos jobs que aplican cambios fijan `"0"`
  #     acá. Una variable declarada en el servicio GANA sobre la del env group.
  #   * `schedule` siempre se interpreta en UTC (Chile = UTC-3 / UTC-4 según el mes).
  #   * Plan Starter: los Cron Jobs no existen en el free tier (mínimo US$1/mes cada uno).
  # ─────────────────────────────────────────────────────────────

  # 1) Backup diario de Neon a R2 (el que ya corre con este mismo nombre).
  - type: cron
    name: proyecto-crossfit
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 6 * * *"                    # 03:00 CLT — diario
    dockerfilePath: backend/Dockerfile.cron
    dockerContext: backend
    dockerCommand: python -m maintenance.backup_cloud
    envVars:
      # ⚠️ `DRY_RUN=0` tiene que estar en el grupo `backups-prod`: la imagen ya no lo
      #    trae y `backup_cloud` cae a `1` = hace el dump y NO SUBE NADA (run verde).
      #    Si el grupo lo perdió, el que avisa es el watchdog (objeto viejo en R2).
      - fromGroup: backups-prod

  # 2) Mantenimiento de datos PROD: vencidos, huérfanas, purga y retención
  #    (días 1 y 15). Escribe en PROD ⇒ `ENVIRONMENT=production` lo valida el script.
  - type: cron
    name: box-crossfit-mantenimiento-prod
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 8 1,15 * *"                 # 05:00 CLT los días 1 y 15
    dockerfilePath: backend/Dockerfile.cron
    dockerContext: backend
    dockerCommand: python -m maintenance.mantenimiento_cloud
    envVars:
      # Ensayo (ROLLBACK): cambiar a "1", correr, leer el log/correo y volver a "0".
      - key: DRY_RUN
        value: "0"
      - fromGroup: mantenimiento-prod        # MAINT_DB_URL (rol maint_rw), límites, ENVIRONMENT
      - fromGroup: alertas                   # GMAIL_SMTP_* + ALERT_EMAIL
      - fromGroup: neon-api                   # sólo lectura de CU-horas y ramas (Fase 7)

  # 3) Watchdog de frescura del backup: avisa si R2 no se renueva (sólo LEE R2).
  - type: cron
    name: box-crossfit-watchdog
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 12 * * *"                   # 09:00 CLT — 6 h después del backup
    dockerfilePath: backend/Dockerfile.cron
    dockerContext: backend
    dockerCommand: python -m maintenance.watchdog_backups
    envVars:
      # Token de SÓLO LECTURA: este job no puede escribir en el bucket de respaldos.
      - fromGroup: r2-lectura
      - fromGroup: alertas
      # No usa `DRY_RUN` (no escribe nada) ni `PROD_DB_DIRECT_URL`.

  # 4) Restore drill mensual: restaura el último backup en una rama Neon desechable
  #    y verifica integridad. Crea y borra ramas ⇒ necesita la API de Neon.
  - type: cron
    name: box-crossfit-restore-drill
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 13 1 * *"                   # 10:00 CLT el día 1 de cada mes
    dockerfilePath: backend/Dockerfile.cron
    dockerContext: backend
    dockerCommand: python -m maintenance.restore_drill
    envVars:
      - fromGroup: backups-prod              # R2 del backup + URL de lectura de PROD
      - fromGroup: neon-api                  # crear/borrar la rama temporal del drill
      - fromGroup: alertas
      # No usa `DRY_RUN`: el destino del restore es una rama desechable, nunca PROD.

  # 5) KPIs diarios/mensuales, predicciones y reentrenamiento ML — reemplaza los
  #    4 workflows de n8n (Fase 8). Llama a la API propia con `X-N8N-API-Key`.
  - type: cron
    name: box-crossfit-kpis-ml
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 10 * * *"                   # 06:00 CLT (07:00 con horario de verano)
    dockerfilePath: backend/Dockerfile.cron
    dockerContext: backend
    dockerCommand: python -m maintenance.kpis_cloud
    envVars:
      # ⚠️ `kpis_cloud` cae a `DRY_RUN=1` si la variable falta: sin esto el job imprime
      #    el plan, NO llama a ningún endpoint y el run queda VERDE (fail-open).
      - key: DRY_RUN
        value: "0"
      - fromGroup: kpis-prod                 # KPIS_API_URL, N8N_API_KEY / CRON_API_KEY
      - fromGroup: alertas
  # ─────────────────────────────────────────────────────────────
  # 6-8) RETENCIÓN DE DATOS (B8) — ALTA HECHA, EN MODO ENSAYO
  # ─────────────────────────────────────────────────────────────
  # Los 3 trabajos existen y están probados: `backend/maintenance/retencion_cloud.py`,
  # migración `065_retencion_datos`, tests `backend/tests/test_retencion_unit.py` (+ integración).
  # Ahora quedan versionados acá, IGUAL que los 5 de arriba, con `DRY_RUN="1"` POR DEFAULT:
  # el primer deploy cuenta filas y NO borra nada. Pasar a `"0"` es una decisión explícita
  # del dueño (como se hizo con el job 2), se cambia acá, se revisa el log de la primera
  # corrida y recién entonces se sincroniza.
  #
  # Requisitos ANTES de sincronizar el Blueprint (si falta uno, el sync FALLA entero y
  # dejaría al web service sin actualizar — ver docs/CRON_JOBS_RENDER.md §8.3):
  #   1. El env group `retencion-test` tiene que EXISTIR en el dashboard (con
  #      `RETENCION_DB_URL` del rol `retencion_rw` y `ENVIRONMENT=test`).
  #   2. La migración 065 tiene que estar aplicada en la base destino (`alembic upgrade head`).
  #   3. Cada `type: cron` es un servicio FACTURADO (US$1/mes de piso).
  #
  # Horarios: los tres son MENSUALES y caen en DÍAS distintos a propósito.
  #   15:00 UTC = 12:00 CLT. Ese hueco queda 9 h después del backup diario (06:00 UTC),
  #   7 h después del mantenimiento (08:00 UTC), 5 h después de los KPIs (10:00 UTC),
  #   3 h después del watchdog (12:00 UTC) y 2 h después del restore drill (13:00 UTC,
  #   día 1: el más caro de la grilla). Ningún job pisa a otro ni compite por la BD.
  #
  - type: cron
    name: box-crossfit-retencion-archivar
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 15 1 * *"                   # 12:00 CLT el día 1 — archiva asistencias/reservas
    dockerfilePath: backend/Dockerfile.cron
    dockerContext: backend
    dockerCommand: python -m maintenance.retencion_cloud archivar
    envVars:
      # Escribir en TEST exige las DOS: `DRY_RUN=0` y `RETENCION_TEST_OK=1` (guarda anti-PROD).
      # Si falta cualquiera de las dos, el job sale con exit 2 y manda correo: no hay forma
      # de que "se olvide" el modo ensayo sin que alguien se entere.
      - key: DRY_RUN
        value: "1"
      - fromGroup: retencion-test            # RETENCION_DB_URL (rol retencion_rw), ENVIRONMENT=test
      - fromGroup: backups-prod              # R2 de respaldo (R2_ENDPOINT, R2_BUCKET, llaves)
      - fromGroup: alertas                   # GMAIL_SMTP_* + ALERT_EMAIL

  - type: cron
    name: box-crossfit-retencion-auditoria
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 15 2 * *"                   # 12:00 CLT el día 2 — TTL de auditoría (2 años)
    dockerfilePath: backend/Dockerfile.cron
    dockerContext: backend
    dockerCommand: python -m maintenance.retencion_cloud auditoria
    envVars:
      - key: DRY_RUN
        value: "1"
      - fromGroup: retencion-test
      - fromGroup: alertas

  - type: cron
    name: box-crossfit-retencion-anonimizar
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 15 3 * *"                   # 12:00 CLT el día 3 — IRREVERSIBLE, nunca junto al archivo
    dockerfilePath: backend/Dockerfile.cron
    dockerContext: backend
    dockerCommand: python -m maintenance.retencion_cloud anonimizar
    envVars:
      - key: DRY_RUN
        value: "1"
      - fromGroup: retencion-test
      - fromGroup: alertas
      - key: ANONIMIZACION_PEPPER
        sync: false                          # secreto: se pega en el dashboard (≥ 16 caracteres)

  # ─────────────────────────────────────────────────────────────
  # 9-11) RETENCIÓN DE DATOS (B8) EN PROD — ALTA HECHA, EN MODO ENSAYO
  # ─────────────────────────────────────────────────────────────
  # Los MISMOS 3 trabajos del bloque *# 6-8)*, apuntando ahora a la rama PROD de
  # Neon con el rol `retencion_rw` de PROD (`RETENCION_DB_URL` del env group
  # `retencion-prod`). `DRY_RUN="1"` POR DEFAULT, igual que en TEST: la primera
  # corrida cuenta filas y NO escribe. Pasar a `"0"` es una decisión explícita del
  # dueño, se cambia acá, se lee el log de la primera corrida y recién entonces se
  # sincroniza (en PROD NO hace falta `RETENCION_TEST_OK`: esa guarda es sólo TEST).
  #
  # Requisitos ANTES de sincronizar el Blueprint (si falta uno, el sync FALLA entero
  # y el web service se queda con la versión anterior — ver docs/CRON_JOBS_RENDER.md §9):
  #   1. El env group `retencion-prod` tiene que EXISTIR en el dashboard:
  #      `RETENCION_DB_URL` (rol `retencion_rw` de PROD, conexión DIRECTA sin `-pooler`),
  #      `ENVIRONMENT=production` y `ANONIMIZACION_PEPPER`.
  #      ⚠️ `ENVIRONMENT` tiene que ser `production` EXACTO: el script sólo acepta
  #      `test`/`production` y rechaza (`prod`, `prd`, …) con exit 2.
  #   2. El rol `retencion_rw` tiene que existir en la rama PROD: `validar_url()` exige
  #      ESE usuario cuando `ENVIRONMENT=production` (si no, exit 2 sin tocar la base).
  #   3. La migración 065 tiene que estar aplicada en PROD (`alembic upgrade head`).
  #   4. Cada `type: cron` es un servicio FACTURADO (US$1/mes de piso).
  #
  # Horarios: mensuales, DÍAS 4/5/6 a las 17:00 UTC (14:00 CLT; 13:00 en invierno).
  #   * 17:00 UTC no lo usa ningún job: los 5 de PROD son 06:00/08:00/10:00/12:00/13:00
  #     y los 3 de retención de TEST son 15:00 (días 1/2/3).
  #   * Días 4/5/6 dejan el día 1 libre: ahí caen el mantenimiento (08:00) y el restore
  #     drill (13:00), los dos jobs más caros de la grilla, y también el `archivar` de TEST.
  #   * Se mantiene el orden del mes: `archivar` (4) antes de `anonimizar` (6), que es el
  #     irreversible, y nunca el mismo día.
  #
  - type: cron
    name: box-crossfit-retencion-archivar-prod
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 17 4 * *"                   # 14:00 CLT el día 4 — archiva asistencias/reservas
    dockerfilePath: backend/Dockerfile.cron
    dockerContext: backend
    dockerCommand: python -m maintenance.retencion_cloud archivar
    envVars:
      # En PROD no hay guarda extra: `DRY_RUN=0` alcanza (a diferencia de TEST, que
      # además exige `RETENCION_TEST_OK=1`). Se deja en "1" hasta que el dueño lo pida.
      - key: DRY_RUN
        value: "1"
      - fromGroup: retencion-prod            # RETENCION_DB_URL (rol retencion_rw de PROD), ENVIRONMENT=production
      - fromGroup: backups-prod              # R2 de respaldo (R2_ENDPOINT, R2_BUCKET, llaves) — su DRY_RUN=0 NO gana: la variable del servicio tiene precedencia
      - fromGroup: alertas                   # GMAIL_SMTP_* + ALERT_EMAIL

  - type: cron
    name: box-crossfit-retencion-auditoria-prod
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 17 5 * *"                   # 14:00 CLT el día 5 — TTL de auditoría (2 años)
    dockerfilePath: backend/Dockerfile.cron
    dockerContext: backend
    dockerCommand: python -m maintenance.retencion_cloud auditoria
    envVars:
      - key: DRY_RUN
        value: "1"
      - fromGroup: retencion-prod
      - fromGroup: alertas

  - type: cron
    name: box-crossfit-retencion-anonimizar-prod
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 17 6 * *"                   # 14:00 CLT el día 6 — IRREVERSIBLE, nunca junto al archivo
    dockerfilePath: backend/Dockerfile.cron
    dockerContext: backend
    dockerCommand: python -m maintenance.retencion_cloud anonimizar
    envVars:
      - key: DRY_RUN
        value: "1"
      - fromGroup: retencion-prod            # acá viene ANONIMIZACION_PEPPER (≥ 16 caracteres)
      - fromGroup: alertas
      # El pepper NO se declara en el servicio (`sync: false`) a propósito: vive en el
      # env group, y una variable del servicio GANARÍA sobre la del grupo (quedaría vacía).

