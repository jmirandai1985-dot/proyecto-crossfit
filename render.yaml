# ============================================================
# render.yaml — Blueprint para desplegar en Render (free tier).
# Un ÚNICO Web Service Docker (imagen combinada: nginx + uvicorn).
# La BD es externa (Neon) → NO se declara database en este archivo.
# n8n y el cron de mantenimiento quedan FUERA de este blueprint.
# ============================================================
services:
  - type: web
    name: box-crossfit
    runtime: docker
    plan: starter
    dockerfilePath: Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    # ── Migraciones ANTES de activar el código nuevo ──
    # ⚠️ El comando NO puede ser "cd backend && alembic upgrade head": la imagen
    #    (Dockerfile.render) copia backend/alembic/ → /app/alembic/ y
    #    backend/alembic.ini → /app/alembic.ini (WORKDIR /app). Dentro del
    #    contenedor NO existe una carpeta backend/.
    # ⚠️ Si el preDeploy falla, Render ABORTA el deploy y deja la versión
    #    anterior corriendo (no hay outage).
    preDeployCommand: "alembic upgrade head"
    envVars:
      # ── Valores fijos (NO secretos) ──
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # ── Secretos / config por entorno: Render los pide manualmente en el
      #    dashboard (sync: false) para no exponerlos en el archivo de git ──
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: REACTIVACION_OPT_OUT_SECRET
        sync: false
      # ── Archivos subidos por la app (app/services/storage.py) ──
      # PROD guarda en Cloudflare R2 (disco efímero: sin esto, cada deploy borra
      # los comprobantes, certificados e imágenes del Bazar).
      - key: STORAGE_BACKEND
        value: r2
      - key: STORAGE_R2_BUCKET
        value: box-crossfit-uploads
      - key: STORAGE_R2_PUBLIC_BUCKET
        value: box-crossfit-public
      # Secretos/config del bucket: se pegan en el dashboard (sync: false).
      - key: STORAGE_R2_ENDPOINT
        sync: false
      - key: STORAGE_R2_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_R2_PUBLIC_BASE_URL
        sync: false
